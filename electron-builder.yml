appId: org.dbapp.desktop
productName: Rowberry
artifactName: "${productName}-${version}-${os}-${arch}.${ext}"
asar: true
directories:
  output: release
files:
  - dist/**
  - package.json
  - LICENSE
npmRebuild: false
mac:
  icon: assets/branding/rowberry.icns
  target:
    - target: dmg
      arch: [arm64]
  hardenedRuntime: true
  notarize: true
  minimumSystemVersion: "13.0"
  category: public.app-category.developer-tools
win:
  icon: assets/branding/rowberry.ico
  target:
    - target: nsis
      arch: [x64]
linux:
  icon: assets/branding/icons
  executableName: rowberry
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  category: Development
  maintainer: dbapp contributors
dmg:
  title: Rowberry
  icon: assets/branding/rowberry.icns
  background: assets/branding/dmg-background.png
  iconSize: 88
  iconTextSize: 13
  window:
    width: 660
    height: 420
  contents:
    - x: 170
      y: 240
      type: file
    - x: 490
      y: 240
      type: link
      path: /Applications
