appId: org.dbapp.desktop
productName: dbapp
asar: true
directories:
  output: release
files:
  - dist/**
  - package.json
npmRebuild: false
mac:
  target:
    - target: dmg
      arch: [arm64, x64]
  identity: null
  minimumSystemVersion: "13.0"
  category: public.app-category.developer-tools
win:
  target:
    - target: nsis
      arch: [x64]
  signAndEditExecutable: false
linux:
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  category: Development
  maintainer: dbapp contributors
