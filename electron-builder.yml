appId: org.dbapp.desktop
productName: Rowberry
asar: true
directories:
  output: release
files:
  - dist/**
  - package.json
npmRebuild: false
mac:
  icon: assets/branding/rowberry.icns
  target:
    - target: dmg
      arch: [arm64, x64]
  identity: null
  minimumSystemVersion: "13.0"
  category: public.app-category.developer-tools
win:
  icon: assets/branding/rowberry.ico
  target:
    - target: nsis
      arch: [x64]
linux:
  icon: assets/branding/icons
  executableName: rowberry
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  category: Development
  maintainer: dbapp contributors
