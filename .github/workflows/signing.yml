name: Signed release candidates
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidate:
    runs-on: macos-latest
    environment: release-signing-macos
    env:
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: test "$(uname -m)" = arm64
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun x --no-install electron-builder --mac --arm64 --publish never -c.forceCodeSigning=true
      - name: Verify signed Apple silicon application
        run: |
          application=release/mac-arm64/Rowberry.app
          codesign --verify --deep --strict --verbose=2 "$application"
          spctl --assess --type execute --verbose=2 "$application"
          xcrun stapler validate "$application"
      - run: bun scripts/checksums.ts
      - uses: actions/upload-artifact@v4
        with:
          name: signed-candidate-${{ runner.os }}-${{ runner.arch }}
          path: |
            release/*.dmg
            release/SHA256SUMS
