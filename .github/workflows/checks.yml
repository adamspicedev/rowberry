name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  scope:
    runs-on: ubuntu-latest
    outputs:
      desktop: ${{ steps.scope.outputs.desktop }}
      website: ${{ steps.scope.outputs.website }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: node --test .github/scripts/ci-scope.test.mjs
      - id: scope
        run: node .github/scripts/ci-scope.mjs
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bunx oxfmt@0.74.0 --check .
  checks:
    needs: scope
    if: needs.scope.outputs.desktop == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run test
      - run: bun run build
      - run: bun run test:e2e
  postgres:
    needs: scope
    if: needs.scope.outputs.desktop == 'true'
    runs-on: ubuntu-latest
    env:
      DBAPP_DOCKER_CONTEXT: default
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Allow Chromium sandbox user namespaces on the ephemeral runner
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: bun install --frozen-lockfile
      - run: bun x playwright install-deps chromium
      - run: bun run test:postgres:setup
      - run: xvfb-run --auto-servernum bun run test:integration
      - run: xvfb-run --auto-servernum bun run test:e2e:postgres
      - if: always()
        run: test ! -f /tmp/dbapp-task3-fixtures.json || bun run test:postgres:cleanup

  compatibility:
    needs: scope
    if: needs.scope.outputs.desktop == 'true'
    strategy:
      fail-fast: false
      matrix:
        postgres: [15, 16, 17]
    runs-on: ubuntu-latest
    env:
      DBAPP_DOCKER_CONTEXT: default
      DBAPP_POSTGRES_VERSIONS: ${{ matrix.postgres }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: bun x playwright install-deps chromium
      - run: bun run test:postgres:setup
      - run: xvfb-run --auto-servernum bun run test:integration tests/integration/connections.test.ts -t 'PostgreSQL [0-9]+|verified TLS and client authentication'
      - if: always()
        run: test ! -f /tmp/dbapp-task3-fixtures.json || bun run test:postgres:cleanup
  package:
    needs: scope
    if: needs.scope.outputs.desktop == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            architecture: arm64
            directory: release/mac-arm64/Rowberry.app
            build: --mac --arm64
          - os: macos-15-intel
            architecture: x64
            directory: release/mac/Rowberry.app
            build: --mac --x64
          - os: windows-latest
            architecture: x64
            directory: release/win-unpacked
            build: --win --x64
          - os: ubuntu-latest
            architecture: x64
            directory: release/linux-unpacked
            build: --linux --x64
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - if: runner.os == 'Linux'
        name: Allow Chromium sandbox user namespaces on the ephemeral runner
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: bun install --frozen-lockfile
      - if: runner.os == 'Linux'
        run: bun x playwright install-deps chromium
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run build
      - run: bun x --no-install electron-builder ${{ matrix.build }} --publish never
      - if: runner.os != 'Linux'
        run: bun run test:e2e
      - if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum bun run test:e2e
      - if: runner.os != 'Linux'
        run: bun run verify:package '${{ matrix.directory }}' '${{ matrix.architecture }}' --assets-only
      - if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum bun run verify:package '${{ matrix.directory }}' '${{ matrix.architecture }}' --assets-only
      - run: bun scripts/verify-package-negative.ts '${{ matrix.directory }}'
      - if: runner.os == 'Linux'
        run: DBAPP_DOCKER_CONTEXT=default bun run test:postgres:setup
      - if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum bun run verify:package '${{ matrix.directory }}' '${{ matrix.architecture }}'
      - if: always() && runner.os == 'Linux'
        run: test ! -f /tmp/dbapp-task3-fixtures.json || DBAPP_DOCKER_CONTEXT=default bun run test:postgres:cleanup
      - run: bun scripts/checksums.ts
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-${{ runner.os }}-${{ matrix.architecture }}
          path: |
            release/*.dmg
            release/*.exe
            release/*.AppImage
            release/*.deb
            release/SHA256SUMS
  website:
    needs: scope
    if: needs.scope.outputs.website == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run typecheck
      - run: bunx playwright install --with-deps chromium
      - run: bun run test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: website-browser-results
          path: apps/web/test-results/
  required:
    name: CI
    if: always()
    needs: [scope, format, checks, postgres, compatibility, package, website]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify every required suite passed
        env:
          CI_RESULTS: ${{ toJSON(needs) }}
        run: node .github/scripts/ci-gate.mjs
