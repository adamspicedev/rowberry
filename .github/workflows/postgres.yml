name: Live PostgreSQL sessions
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  postgres:
    runs-on: ubuntu-latest
    env:
      DBAPP_DOCKER_CONTEXT: default
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Allow Chromium sandbox user namespaces on the ephemeral runner
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: bun install --frozen-lockfile
      - run: bun x playwright install-deps chromium
      - run: bun run test:postgres:setup
      - run: xvfb-run --auto-servernum bun run test:integration
      - run: xvfb-run --auto-servernum bun run test:e2e:postgres
      - if: always()
        run: test ! -f /tmp/dbapp-task3-fixtures.json || bun run test:postgres:cleanup

  compatibility:
    strategy:
      fail-fast: false
      matrix:
        postgres: [15, 16, 17]
    runs-on: ubuntu-latest
    env:
      DBAPP_DOCKER_CONTEXT: default
      DBAPP_POSTGRES_VERSIONS: ${{ matrix.postgres }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: bun x playwright install-deps chromium
      - run: bun run test:postgres:setup
      - run: xvfb-run --auto-servernum bun run test:integration tests/integration/connections.test.ts -t 'PostgreSQL [0-9]+|verified TLS and client authentication'
      - if: always()
        run: test ! -f /tmp/dbapp-task3-fixtures.json || bun run test:postgres:cleanup
